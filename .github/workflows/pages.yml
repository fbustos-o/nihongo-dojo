# Publicación MANUAL en GitHub Pages.
#
# ATENCIÓN: ejecutar este workflow publica el sitio en una URL pública, aunque el repositorio sea privado
# (el contenido incluye datos derivados de Genki, sujetos a copyright). Pages en repos privados requiere
# GitHub Pro/Team. Antes de ejecutarlo: Settings > Pages > Source = "GitHub Actions".
# Solo se dispara a mano (workflow_dispatch); no hay triggers automáticos a propósito.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
