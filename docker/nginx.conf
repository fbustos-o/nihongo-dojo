types {
    application/wasm wasm;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript application/json text/css
               application/wasm image/svg+xml text/html application/octet-stream;

    # Flutter web output is not content-hashed (main.dart.js, assets/...), so
    # always revalidate; unchanged files come back as cheap 304s via ETag.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
