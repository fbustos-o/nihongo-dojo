types {
    application/wasm wasm;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript application/json text/css
               application/wasm image/svg+xml text/html application/octet-stream;

    # Default: always revalidate (cheap 304s via ETag). The legacy Flutter app
    # is not content-hashed, so it relies on this for everything.
    add_header Cache-Control "no-cache";

    # Vite output in /assets/ is content-hashed: cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
